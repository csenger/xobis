[project]
name = "xobis"
version = "0.1.0"
description = "Experiments with the OBIS dataset"
readme = "README.md"
authors = [
    { name = "Carsten Senger", email = "senger@rehfisch.de" }
]
requires-python = ">=3.14"
dependencies = [
    "duckdb>=2.0.0",
    "ipython>=9.18.1",
]

[project.scripts]
xobis = "xobis:main"
obis-repl = "xobis:ipython_repl"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
